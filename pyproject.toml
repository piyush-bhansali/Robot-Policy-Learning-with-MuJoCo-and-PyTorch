[project]
name = "physai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "gymnasium[mujoco]>=1.3.0",
    "hydra-core>=1.3.7",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "wandb>=0.30.0",
]

# Makes `physai/` an installable package: `uv sync` installs it in editable mode,
# so `import physai` works from scripts in any folder (e.g. projects/reacher_fingertip/).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physai"]
